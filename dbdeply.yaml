1. Required Files to Copy
To ensure the deployment works without "Missing Reference" errors, you should copy the following DLLs from a machine that has SSDT/DacFx installed into a folder in your repo (e.g., /tools/dacfx/):
Microsoft.SqlServer.Dac.dll: The primary API for DACPAC operations.
Microsoft.SqlServer.TransactSql.ScriptDom.dll: Handles SQL parsing and script generation.
Microsoft.Data.Tools.Schema.Sql.dll: Core logic for the SQL Server schema model.
Microsoft.SqlServer.Dac.Extensions.dll: (Optional) Needed only if you use custom deployment contributors. 
