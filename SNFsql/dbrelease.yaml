name: SQL Server CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment to deploy'
        required: true
        type: choice
        options:
          - stage
          - pre-prod
          - prod
        default: stage

env:
  SQLPROJ_PATH: 'src/MyDatabase/MyDatabase.sqlproj'
  DACPAC_NAME: 'MyDatabase.dacpac'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ${{ env.SQLPROJ_PATH }}

      - name: Build (produces .dacpac)
        run: dotnet build ${{ env.SQLPROJ_PATH }} --configuration Release --no-restore

      - name: Upload dacpac artifact
        uses: actions/upload-artifact@v4
        with:
          name: dacpac
          path: '**/bin/Release/*.dacpac'
          if-no-files-found: error

  test:
    needs: build
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'YourStrong!Passw0rd'
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd' -C -Q 'SELECT 1'"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Download dacpac
        uses: actions/download-artifact@v4
        with:
          name: dacpac
      - name: Install SqlPackage
        run: dotnet tool install -g Microsoft.SqlPackage
      - name: Deploy dacpac to test container
        run: |
          sqlpackage /Action:Publish \
            /SourceFile:"${{ env.DACPAC_NAME }}" \
            /TargetConnectionString:"Server=localhost;Database=MyDatabase;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True"
      - name: Run tSQLt tests
        run: echo "run your test suite here"

  deploy:
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Enforce release-branch-only for prod
        if: inputs.environment == 'prod' && !startsWith(github.ref, 'refs/heads/release')
        run: |
          echo "::error::Production deploys are only allowed from a release branch. Current ref: ${{ github.ref }}"
          exit 1

      - name: Download dacpac
        uses: actions/download-artifact@v4
        with:
          name: dacpac

      - name: Install SqlPackage
        run: dotnet tool install -g Microsoft.SqlPackage

      - name: Deploy to ${{ inputs.environment }}
        run: |
          sqlpackage /Action:Publish \
            /SourceFile:"${{ env.DACPAC_NAME }}" \
            /TargetConnectionString:"${{ secrets.DB_CONNECTION_STRING }}" \
            /p:BlockOnPossibleDataLoss=true